<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>순서 기억력 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="game-header">
        <div class="title">
          <i class="brain-icon" aria-hidden="true"></i><strong>순서 기억력 패드</strong>
        </div>
        <div class="score-boxes">
          <span>LEVEL <b id="level">0</b></span>
          <span>BEST <b id="best">0</b></span>
          <button id="language-toggle" class="sound-toggle" type="button">English</button>
          <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
            소리 켬
          </button>
        </div>
      </header>

      <section id="config-panel" class="config-panel hidden" aria-label="게임 설정">
        <div id="difficulty-group" class="config-axis hidden">
          <span>난이도</span>
          <div id="difficulty-options" class="option-row"></div>
        </div>
        <div id="variant-group" class="config-axis hidden">
          <span>모드</span>
          <div id="variant-options" class="option-row"></div>
        </div>
      </section>

      <section id="setup" class="setup">
        <div class="hero-brain" aria-hidden="true">◇</div>
        <h1>아케이드 순서 기억력</h1>
        <p>깜빡이는 4색 패드의 패턴을 기억하고 같은 순서로 눌러보세요.</p>
        <button id="start" class="primary" type="button" disabled>게임 시작</button>
      </section>

      <section id="play" class="play hidden">
        <div id="turn-status" class="turn-status">패턴을 준비하는 중입니다.</div>
        <div class="memory-console" aria-label="색상 기억 패드">
          <div class="memory-grid">
            <button class="pad red" data-color="0" type="button" aria-label="빨강"></button>
            <button class="pad green" data-color="1" type="button" aria-label="초록"></button>
            <button class="pad blue" data-color="2" type="button" aria-label="파랑"></button>
            <button class="pad yellow" data-color="3" type="button" aria-label="노랑"></button>
          </div>
          <div class="hub"><span>STAGE</span><b id="hub-level">01</b></div>
        </div>
        <p id="progress" class="progress">0 / 0</p>
      </section>

      <section id="finished" class="finished hidden">
        <span id="finish-title" class="finish-label">게임 종료</span>
        <strong id="summary" class="finish-score"></strong>
        <p id="grade"></p>
        <button id="retry" class="primary" type="button">다시 도전하기</button>
      </section>
      <p id="status" class="status" role="status">게임을 준비하는 중입니다.</p>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
