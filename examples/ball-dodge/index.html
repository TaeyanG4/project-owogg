<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>공 피하기</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      OWOGG Game Creator Manifest v1 reference integration. The serving layer injects window.OWOGG;
      optional chaining keeps the game playable in a standalone local preview.
    -->
    <div id="app">
      <div id="hud">
        <span id="timer">0.0초</span>
      </div>
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1>공 피하기</h1>
        <p>WASD 또는 방향키로 이동하세요. 화면 가장자리에서 공이 날아옵니다.</p>
        <p class="hint">모바일: 화면을 터치한 채로 드래그하면 이동합니다.</p>
        <button id="startButton" type="button">시작</button>
      </div>
      <div id="gameOver" class="hidden">
        <h1>GAME OVER</h1>
        <p id="finalTime">생존 시간: 0.0초</p>
        <button id="restartButton" type="button">다시 시작</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
