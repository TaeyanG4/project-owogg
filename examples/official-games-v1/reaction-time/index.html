<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>반응속도 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="round-header">
        <span id="round">반응속도 테스트</span>
        <span id="average" aria-live="polite"></span>
      </header>

      <section id="config-panel" class="config-panel hidden" aria-label="게임 설정">
        <div id="difficulty-group" class="config-axis hidden">
          <span>난이도</span>
          <div id="difficulty-options" class="option-row"></div>
        </div>
        <div id="variant-group" class="config-axis hidden">
          <span>모드</span>
          <div id="variant-options" class="option-row"></div>
        </div>
      </section>

      <button id="reaction-pad" class="reaction-pad idle" type="button" disabled>
        <strong id="pad-title">게임을 준비하는 중입니다</strong>
        <span id="pad-note">잠시만 기다려 주세요.</span>
      </button>

      <div id="results" class="results" aria-label="라운드별 기록"></div>
      <p id="status" class="status" role="status">게임을 준비하는 중입니다.</p>
      <button id="retry" class="retry hidden" type="button">다시 도전하기</button>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
