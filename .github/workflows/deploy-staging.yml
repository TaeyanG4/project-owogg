name: Deploy Staging

on:
  workflow_call:

concurrency:
  group: owogg-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy isolated Cloudflare Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate isolated Staging configuration
        run: pnpm staging:preflight
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          GAME_ORIGIN: ${{ vars.GAME_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GAME_ORIGIN: ${{ vars.VITE_GAME_ORIGIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_COMMAND_SYNC_ENABLED: ${{ vars.DISCORD_COMMAND_SYNC_ENABLED }}
          DISCORD_INSTALL_URL: ${{ vars.DISCORD_INSTALL_URL }}
          DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
          DISCORD_REDIRECT_URI: ${{ vars.DISCORD_REDIRECT_URI }}
          DISCORD_TEST_GUILD_ID: ${{ vars.DISCORD_TEST_GUILD_ID }}
          STAGING_MULTIPLAYER_ENABLED: ${{ vars.STAGING_MULTIPLAYER_ENABLED || 'false' }}
          MULTIPLAYER_TICKET_KEY_ID: ${{ vars.MULTIPLAYER_TICKET_KEY_ID }}
          MULTIPLAYER_TICKET_PREVIOUS_KEY_ID: ${{ vars.MULTIPLAYER_TICKET_PREVIOUS_KEY_ID || '' }}
          STAGING_ADMIN_USER_IDS: ${{ vars.STAGING_ADMIN_USER_IDS || '' }}
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          STAGING_WEB_SMOKE_ENABLED: ${{ vars.STAGING_WEB_SMOKE_ENABLED || 'false' }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_REGION: ${{ secrets.B2_REGION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GAME_SESSION_SECRET: ${{ secrets.GAME_SESSION_SECRET }}
          MULTIPLAYER_TICKET_SECRET: ${{ secrets.MULTIPLAYER_TICKET_SECRET }}
          MULTIPLAYER_TICKET_PREVIOUS_SECRET: ${{ secrets.MULTIPLAYER_TICKET_PREVIOUS_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Read-only. If a hostname is already attached to another Worker (including Production),
      # stop instead of asking Wrangler to reassign, delete, or overwrite it.
      - name: Check Cloudflare custom-domain ownership (read-only)
        run: pnpm staging:cloudflare:preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # List is read-only and cannot provision a DB. The next script requires both the exact name
      # and operator-provided UUID before it creates the ignored config used by every remote write.
      - name: Verify remote Staging D1 target (read-only)
        run: >-
          pnpm exec wrangler d1 list --json
          --x-provision=false
          --x-auto-create=false
          > "$RUNNER_TEMP/staging-d1-list.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Materialize verified Staging Wrangler config
        run: >-
          pnpm staging:d1:verify
          --d1-list "$RUNNER_TEMP/staging-d1-list.json"
          --write-config apps/api/wrangler.staging.generated.jsonc
        env:
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}

      - name: Apply D1 migrations to Staging
        run: pnpm d1:migrate:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: >-
            deploy
            --env staging
            --config wrangler.staging.generated.jsonc
            --x-provision=false
            --x-auto-create=false
            --define __OWOGG_BUILD_COMMIT_SHA__:'"${{ github.sha }}"'
            --var COMMIT_SHA:${{ github.sha }}
            GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}
            DISCORD_CLIENT_ID:${{ vars.DISCORD_CLIENT_ID }}
            DISCORD_REDIRECT_URI:${{ vars.DISCORD_REDIRECT_URI }}
            DISCORD_PUBLIC_KEY:${{ vars.DISCORD_PUBLIC_KEY }}
            DISCORD_INSTALL_URL:${{ vars.DISCORD_INSTALL_URL }}
            DISCORD_COMMAND_SYNC_ENABLED:false
            FRONTEND_URL:https://stg.owogg.com
            GAME_ORIGIN:https://play-stg.owogg.com
            ADMIN_USER_IDS:${{ vars.STAGING_ADMIN_USER_IDS || '' }}
            MULTIPLAYER_ENABLED:${{ vars.STAGING_MULTIPLAYER_ENABLED || 'false' }}
            MULTIPLAYER_SOCKET_ORIGIN:https://api-stg.owogg.com
            MULTIPLAYER_TICKET_KEY_ID:${{ vars.MULTIPLAYER_TICKET_KEY_ID }}
            MULTIPLAYER_TICKET_PREVIOUS_KEY_ID:${{ vars.MULTIPLAYER_TICKET_PREVIOUS_KEY_ID || '' }}

      # These values are required Worker runtime secrets. The optional previous ticket key
      # is uploaded only during an explicit rotation overlap. Cloudflare CI credentials and the
      # Discord Bot Token are intentionally absent: they must remain CI-only.
      - name: Upload required API runtime secrets
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" \
              --env staging \
              --config wrangler.staging.generated.jsonc \
              --x-provision=false \
              --x-auto-create=false
          }
          put_optional_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              put_secret "$name" "$value"
            fi
          }
          put_secret DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          put_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put_secret GAME_SESSION_SECRET "$GAME_SESSION_SECRET"
          put_secret MULTIPLAYER_TICKET_SECRET "$MULTIPLAYER_TICKET_SECRET"
          put_optional_secret MULTIPLAYER_TICKET_PREVIOUS_SECRET "$MULTIPLAYER_TICKET_PREVIOUS_SECRET"
          put_secret B2_ENDPOINT "$B2_ENDPOINT"
          put_secret B2_REGION "$B2_REGION"
          put_secret B2_BUCKET_NAME "$B2_BUCKET_NAME"
          put_secret B2_KEY_ID "$B2_KEY_ID"
          put_secret B2_APPLICATION_KEY "$B2_APPLICATION_KEY"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GAME_SESSION_SECRET: ${{ secrets.GAME_SESSION_SECRET }}
          MULTIPLAYER_TICKET_SECRET: ${{ secrets.MULTIPLAYER_TICKET_SECRET }}
          MULTIPLAYER_TICKET_PREVIOUS_SECRET: ${{ secrets.MULTIPLAYER_TICKET_PREVIOUS_SECRET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

      - name: Verify Staging API health and provenance
        run: pnpm smoke:prod --api-only --allow-empty-catalog --sha ${{ github.sha }}
        env:
          SMOKE_API_URL: https://api-stg.owogg.com
          STREAMER_ENABLED_PROVIDERS: ""

      - name: Build Web frontend
        run: pnpm --filter @owogg/web build
        env:
          COMMIT_SHA: ${{ github.sha }}
          VITE_API_URL: https://api-stg.owogg.com
          VITE_GAME_ORIGIN: https://play-stg.owogg.com
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy Web Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            deploy
            --env staging
            --config wrangler.jsonc
            --x-provision=false
            --x-auto-create=false

      - name: Smoke test Access-protected Staging Web
        if: ${{ vars.STAGING_WEB_SMOKE_ENABLED == 'true' }}
        run: pnpm smoke:prod --web-only --allow-empty-catalog --sha ${{ github.sha }}
        env:
          SMOKE_WEB_URL: https://stg.owogg.com
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Record explicit Staging Web smoke skip
        if: ${{ vars.STAGING_WEB_SMOKE_ENABLED != 'true' }}
        run: echo "Staging Web smoke explicitly skipped; Cloudflare Access policy remains enforced."

      # Staging never runs the global registration script. Guild registration is deterministic
      # and limited to the dedicated test guild.
      - name: Sync Discord commands to Staging test guild
        run: pnpm discord:commands:register:guild
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_GUILD_ID: ${{ vars.DISCORD_TEST_GUILD_ID }}
