<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>타자 속도 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <div class="utility-bar">
        <button id="language-toggle" class="sound-toggle language-toggle" type="button">
          English
        </button>
        <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
          소리 켬
        </button>
      </div>
      <section id="setup" class="setup">
        <h1>타자 속도 테스트</h1>
        <p id="setup-note">게임을 준비하는 중입니다.</p>
        <div id="mode-options" class="mode-options"></div>
      </section>

      <section id="play" class="play hidden" aria-label="타자 테스트">
        <div class="stats">
          <span><small id="elapsed-label">남은 시간</small><b id="elapsed">90.0초</b></span>
          <span><small id="score-label">종합 점수</small><b id="score">0</b></span>
          <span><small id="wpm-label">속도 (WPM)</small><b id="wpm">0</b></span>
          <span><small id="cpm-label">타수 (CPM)</small><b id="cpm">0</b></span>
          <span><small id="accuracy-label">정확도</small><b id="accuracy">100%</b></span>
        </div>
        <div id="passage-card" class="passage-card">
          <span id="passage-source" class="passage-source"></span>
          <div id="previous-lines" class="line-stack previous-lines" aria-hidden="true"></div>
          <p id="passage" class="passage" aria-live="polite"></p>
          <input
            id="typing-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="표시된 문장 입력"
            placeholder="여기에 현재 줄을 입력하세요"
          />
          <p id="input-note" class="input-note">키보드를 눌러 시작하세요.</p>
          <div id="next-lines" class="line-stack next-lines" aria-hidden="true"></div>
        </div>
      </section>

      <section id="finished" class="finished hidden">
        <span>입력 완료</span>
        <strong id="summary"></strong>
        <p id="result-detail"></p>
        <button id="retry" type="button">다시 도전하기</button>
      </section>
      <p id="status" class="status" role="status">게임을 준비하는 중입니다.</p>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
