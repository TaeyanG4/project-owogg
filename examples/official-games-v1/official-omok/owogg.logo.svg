<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">온라인 오목</title>
  <desc id="desc">보라색 바탕의 오목판 위 흑돌과 백돌</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="40" x2="462" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="wood" x1="142" y1="126" x2="382" y2="394" gradientUnits="userSpaceOnUse">
