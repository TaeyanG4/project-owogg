<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오목</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">OWOGG OFFICIAL</p>
          <h1>오목</h1>
        </div>
        <div id="stone-badge" class="stone-badge hidden" aria-live="polite">
          <span id="badge-stone" class="stone neutral"></span>
          <span id="stone-label">돌 확인 중</span>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <strong id="status-title">게임을 준비하는 중입니다</strong>
        <span id="status-detail">잠시만 기다려 주세요.</span>
      </section>

      <section id="launcher" class="launcher hidden" aria-labelledby="launcher-title">
        <div class="launcher-copy">
          <p class="eyebrow">PLAY MODE</p>
          <h2 id="launcher-title">어떻게 플레이할까요?</h2>
        </div>
        <div id="mode-options" class="mode-grid"></div>
      </section>

      <section id="game" class="game hidden" aria-labelledby="game-title">
        <div class="game-heading">
          <div>
            <p id="mode-label" class="eyebrow">LOCAL MULTI</p>
            <h2 id="game-title">15 × 15</h2>
          </div>
          <div class="actions">
            <button id="reset" type="button">다시 두기</button>
            <button id="leave" class="danger hidden" type="button">방 나가기</button>
          </div>
        </div>
        <div class="turns" aria-label="돌 색 안내">
          <span id="black-label"><i class="stone black"></i>흑 · 선공</span>
          <span id="white-label"><i class="stone white"></i>백</span>
        </div>
        <div class="board-wrap" aria-label="15 곱하기 15 오목판">
          <div id="board" class="board" role="grid" aria-label="오목판"></div>
        </div>
      </section>

      <footer>
        <span id="revision-label">플레이 방식 대기 중</span>
        <span>흑은 정확히 5목 · 백은 5목 이상 연결 시 승리</span>
      </footer>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
