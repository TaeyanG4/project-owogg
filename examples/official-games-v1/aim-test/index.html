<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>에임 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="info-bar">
        <span class="game-name"
          ><i class="target-icon" aria-hidden="true"></i><b id="progress">에임 테스트</b></span
        >
        <span id="elapsed" class="elapsed" aria-live="polite"></span>
      </header>

      <section id="arena" class="arena" aria-label="에임 테스트 표적 영역">
        <div id="setup" class="overlay">
          <div class="hero-target" aria-hidden="true"><span></span></div>
          <h1>에임 테스트</h1>
          <p>나타나는 표적을 최대한 빠르고 정확하게 클릭하세요.</p>
          <div id="difficulty-group" class="choice-group hidden" aria-label="난이도">
            <span>난이도</span>
            <div id="difficulty-options" class="choice-options"></div>
          </div>
          <div id="variant-group" class="choice-group hidden" aria-label="모드">
            <span>모드</span>
            <div id="variant-options" class="choice-options"></div>
          </div>
          <button id="start" class="primary" type="button" disabled>테스트 시작</button>
        </div>

        <div id="countdown" class="overlay countdown hidden" aria-live="assertive"></div>
        <button id="target" class="target hidden" type="button" aria-label="표적">
          <span></span>
        </button>

        <div id="finished" class="overlay hidden">
          <p class="completion-kicker">테스트 완료</p>
          <strong id="summary" class="result-time"></strong>
          <p id="result-detail"></p>
          <button id="retry" class="secondary" type="button">다시 도전</button>
        </div>
      </section>
      <p id="status" class="status" role="status">게임을 준비하는 중입니다.</p>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
