<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>타자 속도 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">SERVER VERIFIED</p>
        <h1>타자 속도 테스트</h1>
        <p id="status" role="status">서버 실행 환경을 확인하는 중입니다.</p>
      </header>
      <section id="setup" class="panel">
        <div class="config-grid">
          <label>난이도<select id="difficulty"></select></label
          ><label>언어<select id="variant"></select></label>
        </div>
        <button id="start" class="primary" type="button">서버 승인 후 시작</button>
      </section>
      <section id="play" class="panel hidden">
        <p id="passage" class="passage"></p>
        <label for="typing-input">위 문장을 정확히 입력하세요.</label>
        <textarea
          id="typing-input"
          rows="4"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>
        <div class="stats">
          <span>진행 <strong id="progress">0 / 0</strong></span
          ><span>정확도 <strong id="accuracy">100%</strong></span
          ><span>시간 <strong id="elapsed">0.0s</strong></span>
        </div>
        <button id="submit" class="primary" type="button" disabled>검증 evidence 제출</button>
      </section>
      <section id="finished" class="panel hidden">
        <h2>입력 완료</h2>
        <p id="summary"></p>
        <p>표시 점수는 참고용이며 최종 WPM은 서버가 계산합니다.</p>
      </section>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
