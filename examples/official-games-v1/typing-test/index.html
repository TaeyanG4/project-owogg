<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>타자 속도 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section id="setup" class="setup">
        <h1>타자 속도 테스트</h1>
        <p id="setup-note">게임을 준비하는 중입니다.</p>
        <div id="mode-options" class="mode-options"></div>
      </section>

      <section id="play" class="play hidden" aria-label="타자 테스트">
        <div class="stats">
          <span>경과 시간 <b id="elapsed">0.0초</b></span>
          <span>속도 (WPM) <b id="wpm">0</b></span>
          <span>타수 (CPM) <b id="cpm">0</b></span>
          <span>정확도 <b id="accuracy">100%</b></span>
        </div>
        <div id="passage-card" class="passage-card">
          <p id="passage" class="passage" aria-live="polite"></p>
          <input
            id="typing-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="표시된 문장 입력"
          />
          <p id="input-note" class="input-note">키보드를 눌러 시작하세요.</p>
        </div>
      </section>

      <section id="finished" class="finished hidden">
        <span>입력 완료</span>
        <strong id="summary"></strong>
        <p id="result-detail"></p>
        <button id="retry" type="button">다시 도전하기</button>
      </section>
      <p id="status" class="status" role="status">게임을 준비하는 중입니다.</p>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
