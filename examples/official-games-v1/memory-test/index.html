<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>순서 기억력 테스트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">SERVER VERIFIED</p>
        <h1>순서 기억력 테스트</h1>
        <p id="status" role="status">서버 실행 환경을 확인하는 중입니다.</p>
      </header>
      <section id="setup" class="panel">
        <div class="config-grid">
          <label>난이도<select id="difficulty"></select></label
          ><label>모드<select id="variant"></select></label>
        </div>
        <button id="start" class="primary" type="button">서버 승인 후 시작</button>
      </section>
      <section id="play" class="panel hidden">
        <div class="stats">
          <span>레벨 <strong id="level">1</strong></span
          ><span>입력 <strong id="progress">0 / 0</strong></span>
        </div>
        <div class="memory-grid" aria-label="색상 기억 패드">
          <button class="pad red" data-color="0" type="button" aria-label="빨강"></button
          ><button class="pad blue" data-color="1" type="button" aria-label="파랑"></button
          ><button class="pad green" data-color="2" type="button" aria-label="초록"></button
          ><button class="pad yellow" data-color="3" type="button" aria-label="노랑"></button>
        </div>
      </section>
      <section id="finished" class="panel hidden">
        <h2 id="finish-title">도전 종료</h2>
        <p id="summary"></p>
        <p>서버가 seed 기반 정답과 입력 시점을 다시 검증합니다.</p>
      </section>
    </main>
    <script src="./rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
