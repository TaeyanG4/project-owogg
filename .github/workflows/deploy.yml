name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: owogg-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sandbox game bundles must only ever be reachable from the dedicated game-hosting host
      # (see apps/api/src/routes/gameServing.ts's origin guard) — GAME_ORIGIN/VITE_GAME_ORIGIN
      # missing or malformed must fail this deploy loudly, not silently ship a Worker that falls
      # back to serving sandbox UGC from api.owogg.com. A production deploy proceeding with the
      # wrong origin is a real security regression, not a cosmetic misconfiguration, so this is a
      # hard gate rather than a warning.
      - name: Validate Production Game Origins
        run: |
          set -e
          fail=0
          check_url() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is not set (repository variable missing)"
              fail=1
              return
            fi
            case "$value" in
              https://*) ;;
              *)
                echo "::error::$name ('$value') must be an https:// URL"
                fail=1
                ;;
            esac
          }
          check_url "GAME_ORIGIN" "$GAME_ORIGIN"
          check_url "VITE_GAME_ORIGIN" "$VITE_GAME_ORIGIN"
          if [ "$GAME_ORIGIN" != "$VITE_GAME_ORIGIN" ]; then
            echo "::error::GAME_ORIGIN ($GAME_ORIGIN) and VITE_GAME_ORIGIN ($VITE_GAME_ORIGIN) must match — the API's origin guard and the web build's iframe src must agree on one host."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::Production game-origin configuration is invalid — see docs/GAME_CREATION_GUIDE.md §3.8/§7. Set both repository variables to the connected game-hosting domain (currently https://play.owogg.com) before deploying."
            exit 1
          fi
          echo "✅ GAME_ORIGIN and VITE_GAME_ORIGIN both set to $GAME_ORIGIN"
        env:
          GAME_ORIGIN: ${{ vars.GAME_ORIGIN }}
          VITE_GAME_ORIGIN: ${{ vars.VITE_GAME_ORIGIN }}

      # Read-only. The independent Repository variable is checked against both the committed
      # Wrangler binding and Cloudflare's exact Production database name/UUID before migration.
      - name: Read remote Production D1 targets
        run: >-
          pnpm exec wrangler d1 list --json
          --x-provision=false
          --x-auto-create=false
          > "$RUNNER_TEMP/production-d1-list.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate isolated Production deployment configuration
        run: pnpm production:preflight --d1-list "$RUNNER_TEMP/production-d1-list.json"
        # Actions scope contract: every new deployment-specific value lives at Repository scope.
        # The PRODUCTION_* prefix isolates these values from the staging Environment without
        # coupling the Production deploy job to a GitHub Environment.
        env:
          PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          PRODUCTION_MULTIPLAYER_ENABLED: ${{ vars.PRODUCTION_MULTIPLAYER_ENABLED }}
          PRODUCTION_MULTIPLAYER_TICKET_KEY_ID: ${{ vars.PRODUCTION_MULTIPLAYER_TICKET_KEY_ID }}
          PRODUCTION_MULTIPLAYER_TICKET_SECRET: ${{ secrets.PRODUCTION_MULTIPLAYER_TICKET_SECRET }}
          PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_KEY_ID: ${{ vars.PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_KEY_ID || '' }}
          PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_SECRET: ${{ secrets.PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_SECRET }}
          PRODUCTION_STREAMER_ENABLED_PROVIDERS: ${{ vars.PRODUCTION_STREAMER_ENABLED_PROVIDERS }}
          PRODUCTION_YOUTUBE_CLIENT_ID: ${{ vars.PRODUCTION_YOUTUBE_CLIENT_ID }}
          PRODUCTION_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRODUCTION_YOUTUBE_CLIENT_SECRET }}
          PRODUCTION_YOUTUBE_API_KEY: ${{ secrets.PRODUCTION_YOUTUBE_API_KEY }}
          PRODUCTION_YOUTUBE_REDIRECT_URI: ${{ vars.PRODUCTION_YOUTUBE_REDIRECT_URI }}
          PRODUCTION_TWITCH_CLIENT_ID: ${{ vars.PRODUCTION_TWITCH_CLIENT_ID }}
          PRODUCTION_TWITCH_CLIENT_SECRET: ${{ secrets.PRODUCTION_TWITCH_CLIENT_SECRET }}
          PRODUCTION_TWITCH_REDIRECT_URI: ${{ vars.PRODUCTION_TWITCH_REDIRECT_URI }}
          PRODUCTION_CHZZK_CLIENT_ID: ${{ vars.PRODUCTION_CHZZK_CLIENT_ID }}
          PRODUCTION_CHZZK_CLIENT_SECRET: ${{ secrets.PRODUCTION_CHZZK_CLIENT_SECRET }}
          PRODUCTION_CHZZK_REDIRECT_URI: ${{ vars.PRODUCTION_CHZZK_REDIRECT_URI }}

      - name: Apply D1 Migrations to Production
        run: pnpm d1:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # Streamer provider client IDs/redirect URIs are non-secret, but every provider declared
          # in PRODUCTION_STREAMER_ENABLED_PROVIDERS passed the fail-closed preflight above.
          # GitHub configuration names stay PRODUCTION-prefixed and are mapped to the Worker's
          # generic runtime bindings only here. Client secrets/API keys come from Repository
          # secrets and are uploaded in the next step.
          #
          # B2_ENDPOINT/B2_REGION/B2_BUCKET_NAME/B2_KEY_ID/B2_APPLICATION_KEY and GAME_ORIGIN's own
          # existence (as a Secret vs. plain Variable, however an operator first set it via the
          # Dashboard) are DELIBERATELY absent from this list, and from `secrets:` below — nothing
          # in this deploy step manages them. That is safe, not an oversight: `wrangler deploy
          # --help` confirms secrets are never deleted by any deployment, with or without
          # `--keep-vars` (not used here — the intentional, "everything this Worker needs is listed
          # right here" alternative to it). GAME_ORIGIN *is* explicitly listed below, though, because
          # unlike a secret it IS a plain var, and plain vars not present in this `--var` list ARE
          # deleted on every deploy that omits `--keep-vars` — which is exactly the loss this line
          # exists to prevent for a value an operator may have first set by hand via the Dashboard.
          command: >-
            deploy
            --env=""
            --define __OWOGG_BUILD_COMMIT_SHA__:'"${{ github.event.workflow_run.head_sha }}"'
            --var COMMIT_SHA:${{ github.event.workflow_run.head_sha }}
            GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}
            DISCORD_CLIENT_ID:${{ vars.DISCORD_CLIENT_ID }}
            DISCORD_REDIRECT_URI:${{ vars.DISCORD_REDIRECT_URI }}
            DISCORD_PUBLIC_KEY:${{ vars.DISCORD_PUBLIC_KEY }}
            DISCORD_INSTALL_URL:${{ vars.DISCORD_INSTALL_URL || '' }}
            DISCORD_COMMAND_SYNC_ENABLED:${{ vars.DISCORD_COMMAND_SYNC_ENABLED || 'false' }}
            FRONTEND_URL:${{ vars.FRONTEND_URL }}
            GAME_ORIGIN:${{ vars.GAME_ORIGIN }}
            ADMIN_USER_IDS:${{ vars.ADMIN_USER_IDS || '' }}
            ADMIN_LOGIN_USERNAME:${{ vars.ADMIN_LOGIN_USERNAME || '' }}
            STREAMER_ENABLED_PROVIDERS:${{ vars.PRODUCTION_STREAMER_ENABLED_PROVIDERS }}
            YOUTUBE_CLIENT_ID:${{ vars.PRODUCTION_YOUTUBE_CLIENT_ID }}
            YOUTUBE_REDIRECT_URI:${{ vars.PRODUCTION_YOUTUBE_REDIRECT_URI }}
            TWITCH_CLIENT_ID:${{ vars.PRODUCTION_TWITCH_CLIENT_ID }}
            TWITCH_REDIRECT_URI:${{ vars.PRODUCTION_TWITCH_REDIRECT_URI }}
            CHZZK_CLIENT_ID:${{ vars.PRODUCTION_CHZZK_CLIENT_ID }}
            CHZZK_REDIRECT_URI:${{ vars.PRODUCTION_CHZZK_REDIRECT_URI }}
            MULTIPLAYER_ENABLED:${{ vars.PRODUCTION_MULTIPLAYER_ENABLED }}
            MULTIPLAYER_SOCKET_ORIGIN:https://api.owogg.com
            MULTIPLAYER_TICKET_KEY_ID:${{ vars.PRODUCTION_MULTIPLAYER_TICKET_KEY_ID }}
            MULTIPLAYER_TICKET_PREVIOUS_KEY_ID:${{ vars.PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_KEY_ID || '' }}
          # Google, Discord and Game Session secrets are always expected to be configured. They go
          # through this list because wrangler-action's `secrets:` input hard
          # -fails the whole action when a listed secret resolves to an empty string, which is
          # exactly the loud, fail-closed behavior a required secret needs (a Production deploy
          # must not silently ship a Worker missing any of them). GAME_SESSION_SECRET signs/verifies
          # the Game Session tokens Game Creator score acceptance depends on
          # (packages/core/src/domain/gameSession.ts) — without it, POST /api/games/:slug/session
          # fails closed with 503 in Production (apps/api/src/routes/games.ts), which is the exact
          # gap this line closes. Streamer secrets are validated conditionally from the explicit
          # enabled-provider list, while Admin step-up secrets remain optional; both groups are
          # uploaded separately in the next step. This list is only for unconditional secrets a
          # Production deploy cannot proceed without.
          secrets: |
            GOOGLE_CLIENT_SECRET
            DISCORD_CLIENT_SECRET
            GAME_SESSION_SECRET
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GAME_SESSION_SECRET: ${{ secrets.GAME_SESSION_SECRET }}

      - name: Upload validated multiplayer, Streamer, and optional Admin secrets
        working-directory: apps/api
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is required after Production preflight"
              exit 1
            fi
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env="" --config wrangler.jsonc
            echo "✅ $name uploaded"
          }
          put_optional_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              put_secret "$name" "$value"
            else
              echo "ℹ️ $name not configured — skipping (외부 설정 대기)"
            fi
          }
          put_secret MULTIPLAYER_TICKET_SECRET "$PRODUCTION_MULTIPLAYER_TICKET_SECRET"
          put_optional_secret MULTIPLAYER_TICKET_PREVIOUS_SECRET "$PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_SECRET"
          put_optional_secret YOUTUBE_CLIENT_SECRET "$PRODUCTION_YOUTUBE_CLIENT_SECRET"
          put_optional_secret YOUTUBE_API_KEY "$PRODUCTION_YOUTUBE_API_KEY"
          put_optional_secret TWITCH_CLIENT_SECRET "$PRODUCTION_TWITCH_CLIENT_SECRET"
          put_optional_secret CHZZK_CLIENT_SECRET "$PRODUCTION_CHZZK_CLIENT_SECRET"
          put_optional_secret ADMIN_GOOGLE_SUBS "$ADMIN_GOOGLE_SUBS"
          put_optional_secret ADMIN_PASSWORD_PBKDF2 "$ADMIN_PASSWORD_PBKDF2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_MULTIPLAYER_TICKET_SECRET: ${{ secrets.PRODUCTION_MULTIPLAYER_TICKET_SECRET }}
          PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_SECRET: ${{ secrets.PRODUCTION_MULTIPLAYER_TICKET_PREVIOUS_SECRET }}
          PRODUCTION_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRODUCTION_YOUTUBE_CLIENT_SECRET }}
          PRODUCTION_YOUTUBE_API_KEY: ${{ secrets.PRODUCTION_YOUTUBE_API_KEY }}
          PRODUCTION_TWITCH_CLIENT_SECRET: ${{ secrets.PRODUCTION_TWITCH_CLIENT_SECRET }}
          PRODUCTION_CHZZK_CLIENT_SECRET: ${{ secrets.PRODUCTION_CHZZK_CLIENT_SECRET }}
          # Admin step-up identity data — sensitive operational config, never a Variable.
          ADMIN_GOOGLE_SUBS: ${{ secrets.ADMIN_GOOGLE_SUBS }}
          # PBKDF2-derived record only (see `pnpm admin:password:hash`) — never the plaintext password.
          ADMIN_PASSWORD_PBKDF2: ${{ secrets.ADMIN_PASSWORD_PBKDF2 }}

      - name: Verify API Health & Provenance
        run: pnpm smoke:prod --api-only --sha ${{ github.event.workflow_run.head_sha }}
        env:
          STREAMER_ENABLED_PROVIDERS: ${{ vars.PRODUCTION_STREAMER_ENABLED_PROVIDERS }}

      - name: Build Web Frontend
        run: pnpm --filter @owogg/web build
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.owogg.com' }}
          VITE_GAME_ORIGIN: ${{ vars.VITE_GAME_ORIGIN }}

      - name: Deploy Web Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env=""

      - name: Smoke Test Web Frontend & Provenance
        run: pnpm smoke:prod --sha ${{ github.event.workflow_run.head_sha }}

      # Runs LAST, after deployment provenance is already verified — command sync never touches
      # the deployed Worker/Web build, so it can never affect exact-SHA provenance. Skips
      # cleanly when unconfigured; fails clearly (not silently) when enabled but misconfigured.
      - name: Sync Discord Commands (global, operator-gated)
        if: ${{ vars.DISCORD_COMMAND_SYNC_ENABLED == 'true' }}
        run: pnpm discord:commands:register
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID || vars.DISCORD_CLIENT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
